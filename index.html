<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<title>Cozinha | Sabor Original</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0d0e11; --surface: #171a20; --surface-2: #20242c; --line: #2d323c;
  --fg: #f1f2f4; --muted: #98a0ad; --gold: #eba63f; --gold-ink: #1b1305;
  --ok: #47c58b; --late: #f0605d; --focus: #ffd37a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4; padding: 0 20px 40px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1800px; margin-inline: auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 18px; }
.brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); line-height: 1; }
.brand-s { font-weight: 700; font-size: clamp(1.6rem, 2.4vw, 2.2rem); letter-spacing: 0.06em; }
.brand-o { font-weight: 600; font-size: clamp(1.2rem, 1.8vw, 1.6rem); color: var(--gold); font-style: italic; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.8rem, 3.2vw, 2.6rem); margin: 0; letter-spacing: 0.02em; }
.count { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.2rem, 2vw, 1.7rem); color: var(--gold); }
.spacer { margin-left: auto; }
.clock { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 2.4vw, 2rem); }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--muted); }
.conn i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.conn.on i { background: var(--ok); }
.conn.off i { background: var(--late); }
.sound-on { color: var(--ok); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 10px; padding: 12px 18px; font-weight: 600; font-size: 1rem; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn[disabled] { opacity: 0.55; cursor: default; }
@keyframes nudge { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 40%, transparent); } }
.btn.nudge { animation: nudge 1.4s ease-in-out infinite; }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 0.8rem; padding: 4px; }
.fila { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px; align-items: start; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.ticket.fresh { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 35%, transparent); }
.ticket.preparando { background: var(--surface-2); }
.t-head { display: flex; align-items: flex-start; gap: 14px; }
.pos { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 2vw, 1.9rem); color: var(--gold-ink); background: var(--gold); border-radius: 8px; padding: 2px 10px; line-height: 1.3; }
.t-mesa { display: grid; line-height: 1; min-width: 0; }
.t-mesa small { font-size: 0.78rem; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }
.t-mesa strong { font-family: var(--font-display); font-weight: 700; font-size: clamp(3rem, 5vw, 4.8rem); overflow-wrap: anywhere; }
.age { margin-left: auto; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.2rem, 1.8vw, 1.7rem); padding: 4px 12px; border-radius: 8px; border: 2px solid var(--ok); color: var(--ok); white-space: nowrap; }
.age.warn { border-color: var(--gold); color: var(--gold); }
.age.late { border-color: var(--late); color: var(--late); }
.t-cli { font-size: clamp(1.15rem, 1.7vw, 1.5rem); font-weight: 600; overflow-wrap: anywhere; }
.t-cli span { display: block; font-size: 0.85rem; color: var(--muted); font-weight: 400; }
.t-items { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: clamp(1.2rem, 1.8vw, 1.6rem); }
.t-items li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--line); }
.t-items b { font-family: var(--font-display); font-weight: 700; color: var(--gold); min-width: 2ch; }
.t-items em { display: block; font-style: normal; font-size: 0.85em; color: var(--late); font-weight: 600; }
.t-obs { border: 1px dashed var(--late); color: var(--late); border-radius: 8px; padding: 8px 10px; font-weight: 600; }
.t-actions .btn { width: 100%; padding: 16px; font-size: 1.2rem; }
.prontos { margin-top: 32px; }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.prontos-list { display: flex; flex-wrap: wrap; gap: 10px; }
.pr { display: flex; align-items: baseline; gap: 10px; border: 1px solid var(--ok); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
.pr strong { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; }
.pr span { color: var(--muted); }
.empty { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 12px; padding: 40px 18px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 2rem; font-weight: 600; margin-bottom: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.login { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 16px; }
.login h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; margin: 0; }
.field { display: grid; gap: 6px; }
.field label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.in { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.05rem; }
.err { color: var(--late); font-weight: 600; min-height: 1.2em; margin: 0; }
.hint { color: var(--muted); font-size: 0.95rem; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .btn.nudge { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-s">SABOR</span><span class="brand-o">Original</span></div>
    <h1 id="title" hidden>Fila da cozinha</h1>
    <span id="k-count" class="count num"></span>
    <span class="spacer"></span>
    <button id="sound" class="btn gold nudge" type="button" hidden>Ligar som e manter tela acesa</button>
    <span id="conn" class="conn" hidden><i></i><span id="conn-txt"></span></span>
    <span id="clock" class="clock num"></span>
    <button id="logout" class="linkbtn" type="button" hidden>Sair</button>
  </header>

  <div id="config-err" class="card" hidden>
    <h2>Falta configurar</h2>
    <p class="hint">Abra este arquivo (index.html) e cole a URL e a chave do seu projeto Supabase no começo do script.</p>
  </div>

  <section id="login" class="login card" hidden>
    <h2>Entrar</h2>
    <form id="login-form" style="display:grid;gap:16px">
      <div class="field"><label for="email">E-mail</label><input id="email" class="in" type="email" autocomplete="username" required></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" class="in" type="password" autocomplete="current-password" required></div>
      <p id="login-err" class="err" role="alert"></p>
      <button class="btn gold" id="login-btn" type="submit">Entrar</button>
    </form>
  </section>

  <main id="app" hidden>
    <div id="fila" class="fila"></div>
    <section class="prontos" id="prontos-wrap" hidden>
      <div class="eyebrow">Prontos, aguardando o garçom</div>
      <div id="prontos" class="prontos-list"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO: cole aqui os dados do seu projeto Supabase ===== */
var SUPABASE_URL = 'https://persjsywifbuhqilktut.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_resb0eT3FvA0q2xxpwR6uw_yaod0nUS';
/* ==================================================================== */
</script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, attrs) {
    var e = document.createElement(tag), a = attrs || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    });
       (function add(list) {
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (c == null || c === false) continue;
        if (Array.isArray(c)) add(c);
        else e.append(c.nodeType ? c : document.createTextNode(String(c)));
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }

  if (!window.supabase || SUPABASE_URL.indexOf('COLE_AQUI') === 0 || SUPABASE_ANON_KEY.indexOf('COLE_AQUI') === 0) {
    $('#config-err').hidden = false; return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var OPEN = ['novo', 'preparando', 'pronto'];
  var orders = new Map(), fresh = new Set(), channel = null, pollTimer = null, loaded = false;
  var audioCtx = null, soundOn = false, wakeLock = null;

  function setConn(state, txt) { var c = $('#conn'); c.hidden = false; c.className = 'conn ' + state; $('#conn-txt').textContent = txt; }
  function ago(ms) { var m = Math.max(0, Math.floor((Date.now() - ms) / 60000)); return m < 1 ? 'agora' : m + ' min'; }
  function ageClass(ms) { var m = Math.floor((Date.now() - ms) / 60000); return m >= 20 ? 'late' : m >= 10 ? 'warn' : ''; }
  function prep(o) { o.t = Date.parse(o.criado_em); o.tp = o.pronto_em ? Date.parse(o.pronto_em) : 0; return o; }

  /* ---------- som ---------- */
  function ensureAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
  }
  function tone(freq, start, dur, vol) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(start); o.stop(start + dur + 0.02);
  }
    var SOM_ARQUIVO = 'alerta.mp3';  /* nome do seu arquivo de áudio */
  var VEZES = 2;                   /* quantas vezes toca a cada pedido novo */
  var somAlerta = new Audio(SOM_ARQUIVO);
  somAlerta.preload = 'auto';
  function alarm(times) {
    if (!soundOn) return;
    var restantes = times > 1 ? VEZES : 1;
    function tocar() {
      try { somAlerta.currentTime = 0; var p = somAlerta.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      restantes--;
    }
    somAlerta.onended = function () { if (restantes > 0) tocar(); };
    tocar();
  }
  function requestWake() {
    try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (soundOn) requestWake(); });
  $('#sound').addEventListener('click', function () {
    ensureAudio(); soundOn = true; alarm(1); requestWake();
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
    var b = $('#sound'); b.hidden = true;
    var s = h('span', { class: 'sound-on', text: 'Som ligado' }); b.parentNode.insertBefore(s, b);
  });
  setInterval(function () {
    if (!soundOn) return;
    var waiting = Array.from(orders.values()).some(function (o) { return o.status === 'novo' && Date.now() - o.t > 45000; });
    if (waiting) alarm(1);
  }, 60000);

  /* ---------- login ---------- */
  function showLogin() { $('#login').hidden = false; $('#app').hidden = true; $('#logout').hidden = true; $('#sound').hidden = true; $('#title').hidden = true; $('#conn').hidden = true; }
  function enter() {
    $('#login').hidden = true; $('#app').hidden = false; $('#logout').hidden = false; $('#title').hidden = false;
    if (!soundOn) $('#sound').hidden = false;
    loaded = false;
    refetch(false).then(function () { loaded = true; });
    subscribe();
    clearInterval(pollTimer);
    pollTimer = setInterval(function () { refetch(loaded); }, 20000);
  }
  function leave() {
    clearInterval(pollTimer);
    if (channel) { sb.removeChannel(channel); channel = null; }
    orders = new Map(); showLogin();
  }
  $('#login-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('#login-btn'); btn.disabled = true; $('#login-err').textContent = '';
    sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#senha').value }).then(function (r) {
      btn.disabled = false;
      if (r.error) { $('#login-err').textContent = 'E-mail ou senha incorretos.'; return; }
      $('#senha').value = ''; enter();
    }, function () { btn.disabled = false; $('#login-err').textContent = 'Sem internet. Tente de novo.'; });
  });
  $('#logout').addEventListener('click', function () { sb.auth.signOut().then(leave); });
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) enter(); else showLogin(); });
  sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') leave(); });

  /* ---------- dados ---------- */
  function markFresh(list) {
    list.forEach(function (o) {
      fresh.add(o.id);
      setTimeout(function () { fresh.delete(o.id); var el = document.querySelector('.ticket[data-id="' + o.id + '"]'); if (el) el.classList.remove('fresh'); }, 12000);
    });
  }
  function sync(rows, doAnnounce) {
    var fresh_ = [], next = new Map();
    rows.forEach(function (o) {
      var prev = orders.get(o.id); next.set(o.id, o);
      if (doAnnounce && !prev && o.status === 'novo') fresh_.push(o);
    });
    orders = next; return fresh_;
  }
  function refetch(doAnnounce) {
    var since = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
    return sb.from('pedidos').select('*').in('status', OPEN).gte('criado_em', since).order('criado_em', { ascending: true }).then(function (r) {
      if (r.error) { setConn('off', 'Sem conexão'); return; }
      var arrived = sync(r.data.map(prep), doAnnounce);
      markFresh(arrived); render(); if (arrived.length) alarm(3);
    }, function () { setConn('off', 'Sem conexão'); });
  }
  function subscribe() {
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('pedidos-tv').on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, function (p) {
      if (!p.new || !p.new.id) return;
      var o = prep(p.new), prev = orders.get(o.id);
      if (OPEN.indexOf(o.status) >= 0) orders.set(o.id, o); else orders.delete(o.id);
      var isNew = !prev && o.status === 'novo';
      if (isNew) markFresh([o]);
      render(); if (isNew) alarm(3);
    }).subscribe(function (st) {
      if (st === 'SUBSCRIBED') { setConn('on', 'Ao vivo'); if (loaded) refetch(true); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') setConn('off', 'Reconectando');
    });
  }
  function setStatus(id, status) {
    var patch = { status: status }; patch[status + '_em'] = new Date().toISOString();
    sb.from('pedidos').update(patch).eq('id', id).then(function (r) {
      if (r.error) setConn('off', 'Falha ao atualizar'); else refetch(false);
    });
  }

  /* ---------- tela ---------- */
  function render() {
    var fila = $('#fila'); fila.textContent = '';
    var all = Array.from(orders.values());
    var queue = all.filter(function (o) { return o.status !== 'pronto'; }).sort(function (a, b) { return a.t - b.t; });
    var done = all.filter(function (o) { return o.status === 'pronto'; }).sort(function (a, b) { return a.tp - b.tp; });
    $('#k-count').textContent = queue.length === 1 ? '1 pedido na fila' : queue.length + ' pedidos na fila';
    if (!queue.length) fila.append(h('div', { class: 'empty' }, h('strong', { text: 'Nenhum pedido na fila' }), 'Quando o garçom enviar, a comanda aparece aqui com aviso sonoro.'));
    queue.forEach(function (o, i) {
      var act = o.status === 'novo'
        ? h('button', { class: 'btn gold', type: 'button', text: 'Começar preparo', onclick: function () { setStatus(o.id, 'preparando'); } })
        : h('button', { class: 'btn gold', type: 'button', text: 'Pronto ✓', onclick: function () { setStatus(o.id, 'pronto'); } });
      fila.append(h('article', { class: 'ticket ' + o.status + (fresh.has(o.id) ? ' fresh' : ''), 'data-id': o.id },
        h('div', { class: 't-head' },
          h('span', { class: 'pos num', text: (i + 1) + 'º' }),
          h('div', { class: 't-mesa' }, h('small', { text: 'MESA' }), h('strong', { class: 'num', text: o.mesa })),
          h('span', { class: 'age num ' + ageClass(o.t), 'data-since': o.t, text: ago(o.t) })),
        (o.cliente || o.garcom) ? h('div', { class: 't-cli' }, o.cliente || 'Sem nome', o.garcom ? h('span', { text: 'Garçom: ' + o.garcom }) : null) : null,
        h('ul', { class: 't-items' }, (o.itens || []).map(function (it) { return h('li', {}, h('b', { class: 'num', text: it.q + '×' }), h('span', {}, it.n, it.o ? h('em', { text: it.o }) : null)); })),
        o.obs ? h('div', { class: 't-obs', text: o.obs }) : null,
        h('div', { class: 't-actions' }, act)));
    });
    var wrap = $('#prontos-wrap'), pl = $('#prontos'); pl.textContent = '';
    wrap.hidden = !done.length;
    done.forEach(function (o) { pl.append(h('div', { class: 'pr' }, h('strong', { class: 'num', text: 'Mesa ' + o.mesa }), o.cliente ? h('span', { text: o.cliente }) : null)); });
  }
  function tick() {
    document.querySelectorAll('.age[data-since]').forEach(function (el) {
      var ms = Number(el.getAttribute('data-since'));
      el.textContent = ago(ms); el.classList.remove('warn', 'late');
      var c = ageClass(ms); if (c) el.classList.add(c);
    });
    var d = new Date();
    $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  setInterval(tick, 15000); tick();
})();
</script>
</body>
</html>
